# =============================================================================
# schema.yaml — THE CONTRACT
# -----------------------------------------------------------------------------
# The unified label taxonomy for Project Guardian.
#
# Every converter (src/data/converters/*), the trainer (src/train/*), and the
# evaluator (src/eval/*) read class IDs FROM THIS FILE. Nothing anywhere else
# may hardcode class names or IDs. If the taxonomy needs to change, it changes
# here — once.
#
# Design note: the detector classes are deliberately COARSE. Fragmenting the
# military domain into many fine ship types would spread positive examples thin
# and collapse recall on the classes we care most about. Keep military as ONE
# class in the detector; fine-grained work is a separate 2nd-stage classifier
# (see `fine_grained` below and src/fine_grained/).
# =============================================================================

# Flip to true on Day 1 once the team agrees the taxonomy is final. Tooling may
# warn (or refuse to regenerate derived configs) when this is still false.
locked: false

# -----------------------------------------------------------------------------
# Detector classes — the single source of truth for class_id <-> name.
# Order IS the class ID. Do not reorder without regenerating data.yaml.
# -----------------------------------------------------------------------------
classes:
  0: container_ship
  1: tanker
  2: cargo
  3: passenger_ferry
  4: yacht
  5: speedboat
  6: fishing_boat
  7: military_vessel

# -----------------------------------------------------------------------------
# Semantic groupings over the detector classes (by class ID).
# The >90% RECALL GATE applies to the `military` group. Overall mAP is
# secondary; when a tradeoff appears, favour military recall.
# -----------------------------------------------------------------------------
groups:
  civilian:     [0, 1, 2, 3, 4]
  small_craft:  [4, 5, 6]
  military:     [7]          # >90% recall gate applies here

# -----------------------------------------------------------------------------
# Fine-grained 2nd-stage classifier (BONUS).
# These labels are NOT extra detector classes. They are applied by a separate
# classifier that runs on crops already detected as military_vessel (class 7).
# Kept disabled until the bonus track is picked up.
# -----------------------------------------------------------------------------
fine_grained:
  enabled: false
  labels:
    - malaysian_rmn   # Royal Malaysian Navy
    - foreign

# -----------------------------------------------------------------------------
# dedup — cross-dataset near-duplicate removal in merge.py (before splitting).
#   method: "greedy" drops an image only if it is within `threshold` of an
#           already-KEPT representative (no transitive chaining). "cluster" is
#           the legacy single-linkage behaviour (kept for comparison; chains).
#   threshold: max hamming distance treated as a near-duplicate. Deliberately
#           conservative (< the old 5) so we err toward KEEPING images — we
#           cannot afford to over-prune military_vessel.
# CLI flags (--dedup-method / --dedup-threshold) override these.
# -----------------------------------------------------------------------------
dedup:
  method: greedy
  threshold: 3

# -----------------------------------------------------------------------------
# domains — which visual domain each source dataset belongs to.
# The frontal/surface and aerial/satellite views are different visual domains;
# merge.py stratifies the train/val/test split across BOTH class and domain so
# each split covers each domain, and eval can report per-domain recall.
# A dataset not listed here falls back to merge.py's --default-domain (surface),
# with a warning. Adjust as datasets are inspected. Values: surface | aerial.
# -----------------------------------------------------------------------------
domains:
  seaships: surface
  singapore_maritime: surface
  # military_ships (Roboflow hanif-noer-r) uses the ShipRSImageNet 50-class
  # taxonomy and is aerial/satellite imagery — same domain as shiprsimagenet.
  military_ships: aerial
  shiprsimagenet: aerial
  hrsc2016: aerial
  dota: aerial

# -----------------------------------------------------------------------------
# mappings — per-source-dataset native class name -> our schema.
#
# Each converter looks up its dataset's block here and translates native labels
# into our class IDs. Conventions:
#   - value is a schema class NAME (must exist in `classes` above)
#   - value `null` means DROP the annotation (not a ship we model)
#   - the key "*" is a wildcard: any native label not otherwise listed maps to
#     this value. Useful for single-purpose datasets (e.g. all-military sets).
#
# These are STUBS. Fill in real native class names as each dataset is inspected
# by its owner (P1). Record every dataset added in data/DATASETS.md.
# -----------------------------------------------------------------------------
mappings:

  seaships:
    # SeaShips (frontal/surface). Real Roboflow class-name strings (nc=6).
    bulk cargo carrier: cargo
    ore carrier: cargo
    general cargo ship: cargo
    container ship: container_ship
    fishing boat: fishing_boat
    passenger ship: passenger_ferry

  singapore_maritime:
    # Singapore Maritime Dataset (frontal/surface, on/off shore). TODO verify.
    ferry: passenger_ferry
    boat: speedboat
    vessel_ship: cargo
    speed_boat: speedboat
    kayak: null
    sail_boat: yacht
    buoy: null

  # shiprsimagenet and military_ships are the SAME ShipRSImageNet 50-class
  # taxonomy (both Roboflow exports), so they share ONE collapse via a YAML
  # anchor (&shiprs50 / *shiprs50) to prevent drift. Deliberately coarse —
  # fragmenting military into fine ship types collapses recall. Overlaps
  # HRSC + FGSD, so DEDUP RISK when combined with those sets.
  shiprsimagenet: &shiprs50
    # --- military_vessel: warships, carriers, subs, landing, auxiliary/support
    AOE: military_vessel
    Arleigh Burke DD: military_vessel
    Asagiri DD: military_vessel
    Atago DD: military_vessel
    Austin LL: military_vessel
    Commander: military_vessel
    EPF: military_vessel
    Enterprise: military_vessel
    Hatsuyuki DD: military_vessel
    Hovercraft: military_vessel        # LCAC landing craft
    Hyuga DD: military_vessel
    LHA LL: military_vessel
    LSD 41 LL: military_vessel
    Masyuu AS: military_vessel
    Medical Ship: null                 # hospital ship — not a threat/combatant; dropped
    Midway: military_vessel
    Nimitz: military_vessel
    Osumi LL: military_vessel
    Other Aircraft Carrier: military_vessel
    Other Auxiliary Ship: military_vessel
    Other Destroyer: military_vessel
    Other Frigate: military_vessel
    Other Landing: military_vessel
    Other Warship: military_vessel
    Patrol: military_vessel            # patrol combatant
    Perry FF: military_vessel
    Sanantonio AS: military_vessel
    Submarine: military_vessel
    Ticonderoga: military_vessel
    Training Ship: military_vessel     # naval training/auxiliary
    Wasp LL: military_vessel
    YuDao LL: military_vessel
    YuDeng LL: military_vessel
    YuTing LL: military_vessel
    YuZhao LL: military_vessel
    # --- civilian
    Container Ship: container_ship
    Oil Tanker: tanker
    Cargo: cargo
    Ferry: passenger_ferry
    Fishing Vessel: fishing_boat
    Other Merchant: cargo              # generic merchant -> coarse cargo bucket
    RoRo: cargo                        # roll-on/roll-off freight
    # --- small craft
    Motorboat: speedboat
    Yacht: yacht
    Sailboat: yacht
    # --- dropped (generic / unmappable / shore infrastructure)
    Barge: null
    Dock: null
    Other Ship: null
    Test Ship: null
    Tugboat: null

  hrsc2016:
    # HRSC2016 (aerial/satellite, high-res). Mostly warships + some merchant.
    # DEDUP RISK: FGSCR-42 derives from DOTA+HRSC; ShipRSImageNet overlaps HRSC.
    aircraft_carrier: military_vessel
    warcraft: military_vessel
    warship: military_vessel
    merchant_ship: cargo
    ship: cargo

  # military_ships (Roboflow hanif-noer-r) is NOT single-purpose — it carries the
  # full ShipRSImageNet 50-class taxonomy including civilians, so a "*"->military
  # wildcard would mislabel civilians as military. It reuses the shiprs collapse.
  military_ships: *shiprs50

  dota:
    # DOTA aerial. `ship` is generic and overlaps other sets heavily.
    # Dropped by default to avoid train/test leakage — maps to null.
    "*": null
    ship: null

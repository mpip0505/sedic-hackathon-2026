name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lightweight deps
        # Phase 0 CI stays light — no torch/ultralytics needed for these checks.
        run: python -m pip install --upgrade pip ruff pyyaml pandas

      - name: Ruff lint
        run: ruff check .

      - name: schema.yaml parses and matches data.yaml
        run: |
          python - <<'PY'
          import sys, yaml

          with open("configs/schema.yaml") as f:
              schema = yaml.safe_load(f)
          with open("configs/data.yaml") as f:
              data = yaml.safe_load(f)

          schema_classes = [schema["classes"][i] for i in sorted(schema["classes"])]
          data_names = data["names"]
          data_classes = [data_names[i] for i in sorted(data_names)]

          if schema_classes != data_classes:
              print("MISMATCH between schema.yaml and data.yaml class lists:")
              print("  schema:", schema_classes)
              print("  data:  ", data_classes)
              sys.exit(1)
          if data["nc"] != len(data_classes):
              print(f"data.yaml nc={data['nc']} != len(names)={len(data_classes)}")
              sys.exit(1)
          print("OK: class lists match ({} classes).".format(len(schema_classes)))
          PY

      - name: Stub predictor still runs
        run: python -m src.inference.predict --source none --stub
